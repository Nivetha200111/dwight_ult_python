<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dwight V13</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud">
    <div class="hud__stats">
      <div class="chips">
        <span class="chip" id="aliveChip">Alive: 0</span>
        <span class="chip" id="escapedChip">Escaped: 0</span>
        <span class="chip" id="hazardChip">Hazards: 0</span>
        <span class="chip" id="statusChip">Status: Working</span>
      </div>
      <div class="controls">
        WASD pan · Scroll zoom · Click follow · Space free camera · B bomb · E quake · F fire · R reset
      </div>
    </div>
    <button id="resetBtn" class="btn btn-primary">Reset</button>
  </div>

  <canvas id="sim"></canvas>
  <div id="targetInfo" class="target-info">Camera free · click a person to follow</div>

  <script src="main.js"></script>
</body>
</html>
