<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DWIGHT UX - Neural ACO Emergency Response System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js" defer></script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0d0f12;
      --ink: #f5f6f8;
      --muted: #a7adba;
      --accent: #00e6b4;
      --accent-2: #7cd6f1;
      --neural: #ff32c8;
      --danger: #ff6b6b;
      --success: #6bff6b;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      background: radial-gradient(120% 120% at 20% 10%, #111726 0, #0d0f12 45%, #0b0d10 100%);
      color: var(--ink);
    }

    #app {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .overlay {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .hud__stats {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--ink);
      font-weight: 500;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    .controls {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .hud__actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .btn {
      font: inherit;
      border: none;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      transition: transform 100ms ease, background 150ms ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #00b894);
      color: #0a1a14;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 230, 180, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    #sim {
      width: 100vw;
      height: 100vh;
      display: block;
      background: linear-gradient(180deg, #0f1218 0%, #090b0f 100%);
    }

    .target-info {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    /* Neural glow animation */
    @keyframes neuralPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 50, 200, 0.3); }
      50% { box-shadow: 0 0 20px rgba(255, 50, 200, 0.6); }
    }

    .neural-active {
      animation: neuralPulse 2s ease-in-out infinite;
    }

    @media (max-width: 900px) {
      .hud {
        flex-direction: column;
        align-items: stretch;
      }
      .hud__actions {
        justify-content: center;
      }
      .controls { font-size: 10px; }
      .chip { font-size: 11px; padding: 5px 8px; }
    }
  </style>
</head>
<body>
  <canvas id="sim"></canvas>
  <div id="app"></div>
  <script type="module" src="main_v2.js"></script>
</body>
</html>
